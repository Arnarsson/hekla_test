services:
  # ============================================
  # INFERENCE - Ollama with GPU passthrough
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: hekla-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hekla-net

  # ============================================
  # DATABASE - PostgreSQL for state/memory
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: hekla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hekla
      POSTGRES_USER: hekla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekla"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hekla-net

  # ============================================
  # QUEUE - Redis for job coordination
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: hekla-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hekla-net

  # ============================================
  # GATEWAY - API router
  # ============================================
  gateway:
    build: ./services/gateway
    container_name: hekla-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ORCHESTRATOR_URL: http://orchestrator:3010
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hekla-net

  # ============================================
  # ORCHESTRATOR - Task routing agent
  # ============================================
  orchestrator:
    build: ./services/agents/orchestrator
    container_name: hekla-orchestrator
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:14b}
    depends_on:
      - ollama
      - redis
      - postgres
    networks:
      - hekla-net

  # ============================================
  # MAIL AGENT - Microsoft Graph integration
  # ============================================
  mail-agent:
    build: ./services/agents/mail
    container_name: hekla-mail-agent
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:14b}
    depends_on:
      - ollama
      - redis
      - postgres
    networks:
      - hekla-net

  # ============================================
  # CALENDAR AGENT - Schedule management
  # ============================================
  calendar-agent:
    build: ./services/agents/calendar
    container_name: hekla-calendar-agent
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:14b}
    depends_on:
      - ollama
      - redis
      - postgres
    networks:
      - hekla-net

  # ============================================
  # MEMORY AGENT - Long-term context
  # ============================================
  memory-agent:
    build: ./services/agents/memory
    container_name: hekla-memory-agent
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:14b}
    depends_on:
      - ollama
      - redis
      - postgres
    networks:
      - hekla-net

  # ============================================
  # LANGFUSE - Observability
  # ============================================
  langfuse:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: hekla-langfuse
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hekla-net

volumes:
  postgres-data:
  redis-data:

networks:
  hekla-net:
    driver: bridge
