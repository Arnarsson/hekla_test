## HEKLA — Docker Compose (Mac Mini M4)
## https://www.hekla.cc/
##
## Ollama runs NATIVELY on macOS for Metal GPU acceleration.
## All agents run in isolated containers for fault tolerance.
##
## Base (16GB):  docker compose up -d
## Full (36GB+): docker compose --profile full up -d
## Ollama: brew install ollama && ollama serve

services:
  # ============================================
  # DATABASE — PostgreSQL for state/memory
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: hekla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hekla
      POSTGRES_USER: hekla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekla"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hekla-net

  # ============================================
  # QUEUE — Redis for serial job coordination
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: hekla-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hekla-net

  # ============================================
  # GATEWAY — API router
  # ============================================
  gateway:
    build: ./services/gateway
    container_name: hekla-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ORCHESTRATOR_URL: http://orchestrator:3010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - hekla-net

  # ============================================
  # ORCHESTRATOR — Task routing agent
  # ============================================
  orchestrator:
    build: ./services/agents/orchestrator
    container_name: hekla-orchestrator
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:7b}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - hekla-net

  # ============================================
  # MAIL AGENT — Microsoft Graph integration
  # Isolated: crash/restart won't affect other agents
  # ============================================
  mail-agent:
    build: ./services/agents/mail
    container_name: hekla-mail
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:7b}
      ORCHESTRATOR_URL: http://orchestrator:3010
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hekla-net

  # ============================================
  # CALENDAR AGENT — Schedule management
  # Isolated: crash/restart won't affect other agents
  # ============================================
  calendar-agent:
    build: ./services/agents/calendar
    container_name: hekla-calendar
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:7b}
      ORCHESTRATOR_URL: http://orchestrator:3010
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hekla-net

  # ============================================
  # MEMORY AGENT — Long-term context
  # Isolated: crash/restart won't affect other agents
  # ============================================
  memory-agent:
    build: ./services/agents/memory
    container_name: hekla-memory
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      ACTIVE_MODEL: ${ACTIVE_MODEL:-qwen2.5:7b}
      ORCHESTRATOR_URL: http://orchestrator:3010
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hekla-net

  # ============================================
  # LANGFUSE — Observability (optional on 16GB)
  # Included with: docker compose --profile full up -d
  # ============================================
  langfuse:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: hekla-langfuse
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://hekla:${POSTGRES_PASSWORD}@postgres:5432/hekla
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hekla-net

volumes:
  postgres-data:
  redis-data:

networks:
  hekla-net:
    driver: bridge
